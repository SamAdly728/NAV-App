<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
        name="description">
    <meta
        content="admin template, ki-admin admin template, dashboard template, flat admin template, responsive admin template, web app"
        name="keywords">
    <meta content="la-themes" name="author">
    <link href="/assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="/assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Reset Password | NAV Productions Admin</title>

    <!--font-awesome-css-->
    <link href="/assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <!-- tabler icons-->
    <link href="/assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- Bootstrap css-->
    <link href="/assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="/assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="/assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body>
    <div class="app-wrapper d-block">
        <div class="">
            <!-- Body main section starts -->
            <main class="w-100 p-0">
                <div class="container-fluid">
                    <!-- Reset Your Password start -->
                    <div class="row">
                        <div class="col-12 p-0">
                            <div class="login-form-container">
                                <div class="mb-4">
                                    <a class="logo" href="/">
                                        <img alt="#" src="/assets/images/logo/3.png">
                                    </a>
                                </div>
                                <div class="form_container">
                                    <form class="app-form" method="POST">
                                        <div class="mb-3 text-center">
                                            <h3>Reset Your Password</h3>
                                            <p class="f-s-12 text-secondary">Create a new password and sign in to admin
                                            </p>
                                        </div>

                                        <div id="alert" class="alert" style="display: none;"></div>

                                        <!-- Current password removed as it's not needed for email-based reset -->

                                        <div class="mb-3">
                                            <label class="form-label">New password</label>
                                            <input class="form-control" name="password" placeholder="Enter New Password"
                                                type="password" required>
                                        </div>
                                        <div class="mb-3">
                                            <label class="form-label">Confirm Password</label>
                                            <input class="form-control" name="confirm_password"
                                                placeholder="Confirm New Password" type="password" required>
                                        </div>
                                        <div>
                                            <button type="submit" class="btn btn-primary w-100">Reset Password</button>
                                        </div>
                                        <div class="text-center mt-3">
                                            <a href="/" class="text-secondary text-decoration-underline f-s-14">Back to
                                                Sign In</a>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- Reset Your Password end -->
                </div>
            </main>
            <!-- Body main section ends -->
        </div>
    </div>
    <!-- latest jquery-->
    <script src="/assets/js/jquery-3.6.3.min.js"></script>

    <!-- Bootstrap js-->
    <script src="/assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>

    <script>
    const params = new URLSearchParams(window.location.search);
    const alert = document.getElementById('alert');
    if (params.get('error')) {
        alert.textContent = 'An error occurred. Please try again.';
        alert.className = 'alert alert-danger';
        alert.style.display = 'block';
    }
    
    // Simple client-side validation
    document.querySelector('form').addEventListener('submit', function(e) {
        const p1 = document.querySelector('input[name="password"]').value;
        const p2 = document.querySelector('input[name="confirm_password"]').value;
        if (p1 !== p2) {
            e.preventDefault();
            alert.textContent = 'Passwords do not match.';
            alert.className = 'alert alert-danger';
            alert.style.display = 'block';
        }
    });
    </script>

</body>

</html>
