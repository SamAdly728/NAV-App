<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAV | Booking Webhooks</title>
  <link rel="icon" type="image/x-icon" href="../assets/images/logo/favicon.png" />
  <link rel="shortcut icon" type="image/x-icon" href="../assets/images/logo/favicon.png" />

  <!--font-awesome-css-->
  <link rel="stylesheet" href="../assets/vendor/fontawesome/css/all.css" />
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet" />
  <!-- tabler icons-->
  <link rel="stylesheet" type="text/css" href="../assets/vendor/tabler-icons/tabler-icons.css" />
  <!--animation-css-->
  <link rel="stylesheet" href="../assets/vendor/animation/animate.min.css" />
  <!--flag Icon css-->
  <link rel="stylesheet" type="text/css" href="../assets/vendor/flag-icons-master/flag-icon.css" />
  <!-- Bootstrap css-->
  <link rel="stylesheet" type="text/css" href="../assets/vendor/bootstrap/bootstrap.min.css" />
  <!-- simplebar css-->
  <link rel="stylesheet" type="text/css" href="../assets/vendor/simplebar/simplebar.css" />
  <!-- App css-->
  <link rel="stylesheet" type="text/css" href="../assets/css/style.css" />
  <!-- Responsive css-->
  <link rel="stylesheet" type="text/css" href="../assets/css/responsive.css" />
</head>
<body>
<div class="app-wrapper">
  <div class="app-content">
    <div class="container-fluid">
      <div class="row m-1">
        <div class="col-12">
          <h4 class="main-title">Recent Booking Webhooks</h4>
          <ul class="app-line-breadcrumbs mb-3">
            <li><a class="f-s-14 f-w-500" href="/dashboard">Dashboard</a></li>
            <li class="active"><a class="f-s-14 f-w-500" href="#">Webhooks</a></li>
          </ul>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
              <h5 class="mb-0">Booking Events</h5>
              <div class="d-flex align-items-center gap-2">
                <small id="last-updated" class="text-muted"></small>
                <button id="refreshBtn" type="button" class="btn btn-sm btn-outline-primary">Refresh</button>
              </div>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table table-striped table-hover align-middle mb-0">
                  <thead>
                    <tr>
                      <th style="min-width:120px">ID</th>
                      <th style="min-width:140px">Name</th>
                      <th style="min-width:180px">Email</th>
                      <th style="min-width:120px">Phone</th>
                      <th style="min-width:120px">Title</th>
                      <th style="min-width:160px">Start</th>
                      <th style="min-width:120px">Status</th>
                      <th style="min-width:160px">Received</th>
                    </tr>
                  </thead>
                  <tbody id="eventsBody">
                    <tr><td colspan="8" class="text-muted">Loading…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- latest jquery-->
<script src="../assets/js/jquery-3.6.3.min.js"></script>
<!-- Bootstrap js-->
<script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<!-- Simple bar js-->
<script src="../assets/vendor/simplebar/simplebar.js"></script>
<!-- Customizer js (defines getLocalStorageItem/setLocalStorageItem used by script.js) -->
<script src="../assets/js/customizer.js"></script>
<!-- App js-->
<script src="../assets/js/script.js"></script>

<script>
(function(){
  const body = document.getElementById('eventsBody');
  const ts = document.getElementById('last-updated');

  function tr(cells){
    const tr = document.createElement('tr');
    cells.forEach(html => { const td = document.createElement('td'); td.innerHTML = html; tr.appendChild(td); });
    return tr;
  }

  function fmt(x){ if(!x) return ''; const d=new Date(x); return isNaN(d)? String(x): d.toLocaleString(); }

  function render(items){
    body.innerHTML = '';
    if(!items || !items.length){
      const row = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 8; td.className='text-muted'; td.textContent='No events yet';
      row.appendChild(td); body.appendChild(row); return;
    }
    items.slice().reverse().forEach(ev => {
      body.appendChild(tr([
        ev.id || '',
        (ev.name || '').toString().replace(/</g,'&lt;'),
        (ev.email || '').toString().replace(/</g,'&lt;'),
        (ev.phone || '').toString().replace(/</g,'&lt;'),
        (ev.title || 'Booking').toString().replace(/</g,'&lt;'),
        fmt(ev.startTime),
        `<span class="badge ${ev.status==='confirmed'?'bg-success':'bg-secondary'}">${ev.status||''}</span>`,
        fmt(ev.createdAt)
      ]));
    });
    if (ts) ts.textContent = `Updated ${new Date().toLocaleString()}`;
  }

  function load(){
    fetch('/api/ghl/booking-webhooks/recent', { credentials: 'include' })
      .then(r => r.ok ? r.json() : Promise.reject(new Error('Failed to load')))
      .then(data => render(data.items))
      .catch(() => { body.innerHTML = '<tr><td colspan="6" class="text-danger">Unable to load</td></tr>'; });
  }

  document.getElementById('refreshBtn').addEventListener('click', function(){
    this.disabled = true; this.textContent = 'Refreshing…';
    load();
    setTimeout(() => { this.disabled = false; this.textContent = 'Refresh'; }, 600);
  });

  load();
})();
</script>
</body>
</html>
