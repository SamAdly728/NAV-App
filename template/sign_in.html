<!DOCTYPE html>
<html lang="en">

<head>
    <meta content="text/html; charset=UTF-8" http-equiv="Content-Type">
    <meta content="IE=edge" http-equiv="X-UA-Compatible">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="Multipurpose, super flexible, powerful, clean modern responsive bootstrap 5 admin template"
        name="description">
    <meta
        content="admin template, ki-admin admin template, dashboard template, flat admin template, responsive admin template, web app"
        name="keywords">
    <meta content="la-themes" name="author">
    <link href="../assets/images/logo/favicon.png" rel="icon" type="image/x-icon">
    <link href="../assets/images/logo/favicon.png" rel="shortcut icon" type="image/x-icon">

    <title>Sign In | NAV Productions Admin</title>

    <!--font-awesome-css-->
    <link href="../assets/vendor/fontawesome/css/all.css" rel="stylesheet">

    <!-- Fonts -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
        rel="stylesheet">

    <!-- tabler icons-->
    <link href="../assets/vendor/tabler-icons/tabler-icons.css" rel="stylesheet" type="text/css">

    <!-- phosphor-icon css-->
    <link href="../assets/vendor/phosphor/phosphor-bold.css" rel="stylesheet">

    <!-- Bootstrap css-->
    <link href="../assets/vendor/bootstrap/bootstrap.min.css" rel="stylesheet" type="text/css">

    <!-- App css-->
    <link href="../assets/css/style.css" rel="stylesheet" type="text/css">

    <!-- Responsive css-->
    <link href="../assets/css/responsive.css" rel="stylesheet" type="text/css">

</head>

<body class="sign-in-bg">
    <div class="app-wrapper d-block">
        <div class="">
            <!-- Body main section starts -->
            <div class="container main-container">
                <div class="row main-content-box">
                    <div class="col-lg-7 image-content-box d-none d-lg-block">
                        <div class="form-container">
                            <div class="signup-content mt-4">
                                <span>
                                    <img alt="" class="img-fluid " src="../assets/images/logo/1.png">
                                </span>
                            </div>

                            <div class="signup-bg-img">
                                <img alt="" class="img-fluid" src="../assets/images/login/01.png">
                            </div>
                        </div>

                    </div>
                    <div class="col-lg-5 form-content-box">
                        <div class="form-container ">
                            <form class="app-form" method="POST" action="/auth/login">
                                <div class="row">
                                    <div class="col-12">
                                        <div class="mb-5 text-center text-lg-start">
                                            <h2 class="text-white f-w-600">Welcome to <span class="text-dark">NAV
                                                    Productions</span></h2>
                                            <p class="f-s-16 mt-2">Sign in with your data that you enterd during your
                                                registration</p>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="email" name="email" placeholder="Email"
                                                type="email" required>
                                            <label for="email">Email</label>
                                        </div>
                                    </div>
                                    <div class="col-12">

                                        <div class="form-floating mb-3">
                                            <input class="form-control" id="password" name="password"
                                                placeholder="Password" type="password" required>
                                            <label for="password">Password</label>

                                        </div>
                                        <div class="text-end ">
                                            <a class="text-dark f-w-500 text-decoration-underline"
                                                href="/forgot-password">Forgot password</a>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-check d-flex align-items-center gap-2 mb-3">
                                            <input class="form-check-input w-25 h-25" id="checkDefault" type="checkbox"
                                                value="">
                                            <label class="form-check-label text-white mt-2 f-s-16 text-dark"
                                                for="checkDefault">
                                                Remember me
                                            </label>
                                        </div>
                                    </div>
                                    <div id="error-message" class="col-12 mt-2 d-none">
                                        <div class="alert alert-danger p-2 mb-0" role="alert"></div>
                                    </div>
                                    <div class="col-12 mt-3">
                                        <button type="submit" class="btn btn-primary btn-lg w-100" role="button">
                                            Sign In
                                        </button>
                                    </div>
                                    <div class="col-12 mt-4">
                                        <div class="text-center text-lg-start f-w-500">
                                            Don't have your account yet?
                                            <a class="text-white-800 text-decoration-underline"
                                                href="./sign_up.html">Sign up</a>
                                        </div>
                                    </div>
                                    <div class="col-12 mt-4">
                                        <div class="text-center">
                                            <p class="text-muted mb-2">Or sign in with</p>
                                            <a class="btn btn-light icon-btn w-45 h-45 b-r-15 d-inline-flex align-items-center justify-content-center"
                                                href="/auth/google" title="Google Login">
                                                <i class="ph-bold ph-google-logo f-s-20"></i>
                                            </a>
                                        </div>
                                    </div>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Body main section ends -->
        </div>
    </div>
    <!-- latest jquery-->
    <script src="../assets/js/jquery-3.6.3.min.js"></script>

    <!-- Bootstrap js-->
    <script src="../assets/vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const error = params.get('error');
            if (error) {
                const map = {
                    'credentials': 'Invalid email or password.',
                    'google': 'Google account not found. Please contact support or sign up.',
                    'no-account': 'Google account not linked to any NAV Productions user.',
                    'missing': 'Please provide both email and password.'
                };
                const el = document.getElementById('error-message');
                if (el) {
                    el.classList.remove('d-none');
                    el.querySelector('.alert').textContent = map[error] || 'Login failed.';
                }
            }
        })();
    </script>


</body>

</html>
